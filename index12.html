        /* =========================================
   PLAYER4D - DARK RED & LUXURY GOLD THEME
========================================= */

:root {
    /* MAIN COLORS */
    --gold: #f6d365;
    --gold-light: #fff3b0;
    --gold-dark: #b8860b;

    --red: #e50914;
    --red-light: #ff3b3b;
    --red-dark: #7a0008;

    --crimson: #9d0712;
    --wine: #3b0206;

    --black: #050303;
    --black-light: #120609;
    --dark-red: #1c0508;

    /* BACKGROUND */
    --bg-gradient:
        radial-gradient(circle at top center, #4a0710 0%, transparent 35%),
        radial-gradient(circle at bottom right, #250006 0%, transparent 40%),
        linear-gradient(135deg, #090304 0%, #160306 45%, #030202 100%);
}


/* === RESET === */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}


/* === BODY === */

body {
    font-family: 'Poppins', sans-serif;
    background: var(--bg-gradient);
    color: #ffffff;
    min-height: 100vh;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    overflow-x: hidden;
}


/* === LINK === */

a {
    text-decoration: none;
    color: inherit;
    transition: all 0.3s ease;
}

ul {
    list-style: none;
}


/* =========================================
   CONTAINER
========================================= */

#container {
    width: 100%;
    max-width: 480px;
    padding: 20px;

    position: relative;
    z-index: 2;
}


/* =========================================
   LOGO
========================================= */

.logo-wrapper {
    text-align: center;
    margin-bottom: 20px;

    animation: float 3s ease-in-out infinite;
}


@keyframes float {

    0%,
    100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-8px);
    }

}


/* GOLD + RED GLOW */

.logo-img {
    filter:
        drop-shadow(0 0 8px rgba(246, 211, 101, 0.55))
        drop-shadow(0 0 20px rgba(229, 9, 20, 0.35));
}


/* =========================================
   TITLE
========================================= */

h1.title {

    font-family: 'Orbitron', sans-serif;

    font-size: 18px;
    text-align: center;

    text-transform: uppercase;

    margin-bottom: 25px;

    background:
        linear-gradient(
            90deg,
            #ffffff,
            var(--gold-light),
            var(--gold),
            #ffffff
        );

    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;

    line-height: 1.5;

    letter-spacing: 0.5px;

    filter:
        drop-shadow(0 0 8px rgba(246, 211, 101, 0.35));

}


/* =========================================
   HERO IMAGE CARD
========================================= */

.hero-card {

    border-radius: 18px;

    overflow: hidden;

    border: 2px solid var(--gold);

    background: #080304;

    box-shadow:
        0 0 8px rgba(246, 211, 101, 0.5),
        0 0 25px rgba(229, 9, 20, 0.35),
        0 15px 40px rgba(0, 0, 0, 0.8);

    margin-bottom: 30px;

    position: relative;

}


/* GOLD LIGHT SHINE */

.hero-card::after {

    content: '';

    position: absolute;

    top: 0;
    left: -100%;

    width: 45%;
    height: 100%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255, 235, 150, 0.28),
            transparent
        );

    transform: skewX(-25deg);

    animation: shine 4s infinite;

}


@keyframes shine {

    0% {
        left: -100%;
    }

    25% {
        left: 200%;
    }

    100% {
        left: 200%;
    }

}


/* =========================================
   BUTTON LIST
========================================= */

.btn-list {

    display: flex;

    flex-direction: column;

    gap: 15px;

}


/* =========================================
   GENERAL BUTTON
========================================= */

.btn {

    display: flex;

    align-items: center;
    justify-content: center;

    padding: 16px;

    border-radius: 50px;

    font-weight: 800;

    font-size: 16px;

    text-transform: uppercase;

    letter-spacing: 1px;

    position: relative;

    overflow: hidden;

    border: 1px solid transparent;

    transition:
        transform 0.3s ease,
        box-shadow 0.3s ease;

}


/* =========================================
   LOGIN BUTTON - LUXURY GOLD
========================================= */

.btn-login {

    background:
        linear-gradient(
            90deg,
            #b8860b,
            #f6d365,
            #fff0a5,
            #d4a017,
            #f6d365
        );

    background-size: 250% auto;

    color: #210000;

    animation: shimmer 4s linear infinite;

    border-color: rgba(255, 240, 165, 0.7);

    box-shadow:
        0 0 12px rgba(246, 211, 101, 0.35),
        0 6px 20px rgba(0, 0, 0, 0.65);

}


/* =========================================
   DAFTAR BUTTON - CRIMSON RED
========================================= */

.btn-daftar {

    background:
        linear-gradient(
            90deg,
            #650008,
            #b50815,
            #e50914,
            #92000b,
            #650008
        );

    background-size: 250% auto;

    color: #ffffff;

    animation: shimmer 4s linear infinite reverse;

    border-color: rgba(255, 80, 80, 0.45);

    box-shadow:
        0 0 15px rgba(229, 9, 20, 0.3),
        0 6px 20px rgba(0, 0, 0, 0.65);

}


/* =========================================
   ALTERNATIVE BUTTON
========================================= */

.btn-alt {

    background:
        linear-gradient(
            135deg,
            rgba(80, 5, 10, 0.8),
            rgba(15, 3, 5, 0.95)
        );

    color: var(--gold-light);

    border: 1px solid rgba(246, 211, 101, 0.65);

    backdrop-filter: blur(8px);

    box-shadow:
        inset 0 0 15px rgba(229, 9, 20, 0.08),
        0 5px 18px rgba(0, 0, 0, 0.6);

}


/* =========================================
   BUTTON SHIMMER
========================================= */

@keyframes shimmer {

    to {
        background-position: 250% center;
    }

}


/* =========================================
   HOVER EFFECT
========================================= */

.btn:hover {

    transform:
        translateY(-2px)
        scale(1.02);

    box-shadow:
        0 0 12px rgba(246, 211, 101, 0.4),
        0 0 28px rgba(229, 9, 20, 0.35),
        0 10px 30px rgba(0, 0, 0, 0.75);

}


/* =========================================
   FOOTER
========================================= */

.footer {

    margin-top: 40px;

    font-size: 12px;

    color: #b9a5a5;

    text-align: center;

}


.footer a {

    color: var(--gold);

}


.footer a:hover {

    color: var(--gold-light);

    text-shadow:
        0 0 10px rgba(246, 211, 101, 0.6);

}


/* =========================================
   BACKGROUND PARTICLES
========================================= */

.bg-particles {

    position: fixed;

    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    z-index: 1;

    background-image:

        radial-gradient(
            circle at 10% 15%,
            rgba(229, 9, 20, 0.22) 0%,
            transparent 35%
        ),

        radial-gradient(
            circle at 90% 20%,
            rgba(246, 211, 101, 0.10) 0%,
            transparent 30%
        ),

        radial-gradient(
            circle at 80% 85%,
            rgba(140, 0, 15, 0.22) 0%,
            transparent 40%
        ),

        radial-gradient(
            circle at 20% 90%,
            rgba(246, 211, 101, 0.06) 0%,
            transparent 30%
        );

    pointer-events: none;

}
