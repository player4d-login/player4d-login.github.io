.PLAYER4D-login-container{

/* ============================= */
/* ===== BUTTON 2 ============= */
/* ============================= */

.btn2{
    margin-bottom:20px;

    display:flex;
    justify-content:center;
    align-items:center;

    width:100%;
    overflow:hidden;

    height:3rem;

    background-size:300% 300%;

    backdrop-filter:blur(1rem);

    border-radius:.38rem;

    transition:.5s;

    animation:
    gradient_301 5s ease infinite;

    border:double 4px transparent;

    background-image:
    linear-gradient(
    90deg,
    #3b0028,
    #1a0014);

    background-origin:border-box;
    background-clip:content-box,border-box;

    position:relative;

    border:2px solid #ff66cc;

    text-shadow:
    0 0 6px rgba(255,105,180,.8),
    0 0 12px rgba(255,20,147,.7),
    0 0 18px rgba(255,77,184,.6);

    box-shadow:
    0 0 10px rgba(255,105,180,.7),
    0 0 20px rgba(255,20,147,.6),
    0 0 30px rgba(255,77,184,.5);

    z-index:1;
}

.btn2:hover{
    transform:scale(1.05);

    filter:brightness(1.2);

    box-shadow:
    0 0 20px #ff66cc,
    0 0 40px #ff1493,
    0 0 60px #ff4db8,
    inset 0 0 12px #ff4db8;
}

.btn2:active{
    border:double 4px #ff66cc;
    background-origin:border-box;
    background-clip:content-box,border-box;
    animation:none;
}

.btn2:active .circle{
    background:#ff66cc;
}

.btn2 strong{
    letter-spacing:2px;
    z-index:2;
    color:#fff;

    text-shadow:
    0 0 5px rgba(255,255,255,.5);
}

/* ============================= */
/* ===== BTN BEFORE =========== */
/* ============================= */

.btn2:before{
    content:"";

    position:absolute;
    inset:-4px;

    background:
    linear-gradient(
    45deg,
    #ff8ad8,
    #ff66cc,
    #ff1493,
    #ff4db8,
    #ff8ad8);

    border-radius:.5rem;

    z-index:-2;

    filter:blur(15px);

    opacity:.7;

    animation:pulse 2s infinite;
}

/* ============================= */
/* ===== STARS ================= */
/* ============================= */

#container-stars{
    position:absolute;
    z-index:-1;

    width:100%;
    height:100%;

    overflow:hidden;

    transition:.5s;

    backdrop-filter:blur(1rem);

    border-radius:.38rem;
}

.btn2:hover #container-stars{
    z-index:1;
    background-color:#1a0014;
}

#stars{
    position:relative;
    background:0 0;

    width:200rem;
    height:200rem;
}

#stars::after{
    content:"";

    position:absolute;

    top:-10rem;
    left:-100rem;

    width:100%;
    height:100%;

    animation:
    animStarRotate 90s linear infinite;

    background-image:
    radial-gradient(
    #ffd6f5 1px,
    transparent 1%);

    background-size:50px 50px;
}

#stars::before{
    content:"";

    position:absolute;

    top:0;
    left:-50%;

    width:170%;
    height:500%;

    animation:
    animStar 60s linear infinite;

    background-image:
    radial-gradient(
    #ff8ad8 1px,
    transparent 1%);

    background-size:50px 50px;

    opacity:.5;
}

    z-index:-1;

    animation:
    steam 5s linear infinite;

    border-radius:10px;
}

/* ============================= */

/* ============================= */

@keyframes gradient_301{

@keyframes pulse_3011{

@keyframes steam{

    }

    50%{

    }

    100%{

    }
}

@keyframes pulse{
    0%{
        opacity:.4;
    }

    50%{
        opacity:.8;
    }

    100%{

    }
